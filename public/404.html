<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SMS Immobilier</title>
  <script>
    // Redirige toutes les URLs vers index.html pour le routing SPA
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      '/?p=' + encodeURIComponent(l.pathname + l.search) + l.hash
    );
  </script>
</head>
<body></body>
</html>
